services:
  # FastAPI Backend Service
  - type: web
    name: launchboard-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: DATABASE_URL
        fromDatabase:
          name: launchboard-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: AI_MODEL
        value: gemini-2.0-flash
      - key: AI_PROVIDER
        value: gemini
      - key: CORS_ORIGINS
        value: '["https://launchboard.vercel.app","http://localhost:3000"]'
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_SCHEDULER
        value: "true"

databases:
  # Hosted PostgreSQL
  - name: launchboard-db
    databaseName: launchboard
    user: launchboard
    plan: free

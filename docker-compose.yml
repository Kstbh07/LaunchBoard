services:
  postgres:
    image: postgres:16-alpine
    container_name: launchboard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: launchboard
      POSTGRES_PASSWORD: launchboard_password
      POSTGRES_DB: launchboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchboard -d launchboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: launchboard_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://launchboard:launchboard_password@postgres:5432/launchboard
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev_admin_key_12345}
      AI_MODEL: ${AI_MODEL:-gemini-2.0-flash}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: launchboard_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
